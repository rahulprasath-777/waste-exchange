{% extends "base.html" %}

{% block title %}500 - Server Error - KING Waste Exchange{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 5rem 2rem; max-width: 600px; margin: 3rem auto;">
    <div style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.1);
        border: 2px solid #ef4444;
        margin-bottom: 1.5rem;
    ">
        <span style="font-size: 2.5rem;">⚠️</span>
    </div>
    <h1 style="font-family: 'Outfit', sans-serif; font-size: 2.25rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.5rem;">
        500 - Server Error
    </h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
        An unexpected issue occurred while processing your request. Please retry in a moment.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 0.8rem 1.75rem;">
        ← Return to Marketplace Home
    </a>
</div>
{% endblock %}
