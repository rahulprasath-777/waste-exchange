{% extends "base.html" %}

{% block title %}Sign In - KING Waste Exchange{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto 5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid #f59e0b;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
        ">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="King Logo" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover;">
        </div>
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.85rem; font-weight: 800; color: var(--slate-900);">
            Welcome Back
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
            Access your KING enterprise trading dashboard
        </p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="username">Username or Account ID *</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-submit" style="margin-top: 1.75rem;">
            <button type="submit" class="btn btn-success" style="width: 100%; font-size: 1.05rem; padding: 0.85rem;">
                Sign In to Enterprise Account
            </button>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-100); color: var(--text-muted); font-size: 0.9rem;">
            New to KING Waste Exchange? 
            <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                Create an Account
            </a>
        </div>
    </form>
</div>
{% endblock %}
